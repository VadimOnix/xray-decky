name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Superseded runs on the same branch/PR are cancelled to save queue time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare-frontend:
    name: Prepare Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'pnpm'
      - run: pnpm install

  lint-frontend-eslint:
    name: Lint Frontend (ESLint)
    runs-on: ubuntu-latest
    needs: prepare-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run lint:eslint

  lint-frontend-prettier:
    name: Lint Frontend (Prettier)
    runs-on: ubuntu-latest
    needs: prepare-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run lint:prettier

  lint-frontend-ts:
    name: Lint Frontend (TS Check)
    runs-on: ubuntu-latest
    needs: prepare-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run lint:ts

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run build
      - name: Verify dist/index.js exists
        run: test -f dist/index.js

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Lint backend
        run: ruff check py_modules/ tests/ main.py conftest.py

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pytest pytest-asyncio aiohttp
      - name: Run tests
        run: pytest tests/

  validate-plugin-structure:
    name: Validate Plugin Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed by the CHANGELOG check to exempt versions that
          # are already released.
          fetch-tags: true
      - name: Check mandatory files
        run: |
          test -f plugin.json || (echo "plugin.json missing" && exit 1)
          test -f package.json || (echo "package.json missing" && exit 1)
          test -f LICENSE || (echo "LICENSE missing" && exit 1)
          test -f main.py || (echo "main.py missing" && exit 1)
          echo "All mandatory files present"
      - name: Validate metadata and pinned-version files
        run: |
          # plugin.json / package.json must be valid JSON.
          jq -e . plugin.json > /dev/null
          jq -e . package.json > /dev/null
          # package.json version must be semver-ish (release automation tags v<version>).
          VERSION=$(jq -r '.version' package.json)
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || (echo "package.json version '$VERSION' is not semver" && exit 1)
          # Core pin files are read at runtime by the self-heal downloader and
          # at release time by the workflow — a broken pin breaks both.
          for pin in py_modules/backend/src/xray_version.json py_modules/backend/src/singbox_version.json; do
            jq -e . "$pin" > /dev/null || (echo "$pin is not valid JSON" && exit 1)
            for field in repo asset version; do
              jq -er ".${field} // empty" "$pin" | grep -q . \
                || (echo "$pin missing '$field'" && exit 1)
            done
          done
          echo "Metadata and pin files OK (version: $VERSION)"
      - name: Require a CHANGELOG section for the current version
        run: |
          # Merging a version bump to master publishes a release
          # (auto-release.yml), so the release must never ship without its
          # CHANGELOG slice. scripts/prepare-release.sh creates both at once.
          VERSION=$(jq -r '.version' package.json)
          if grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has a [${VERSION}] section"
          elif git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            # Already-released versions (e.g. historical 1.0.1) are exempt —
            # the check only gates versions that would trigger a new release.
            echo "v${VERSION} is already tagged; CHANGELOG section not required"
          else
            echo "::error::package.json is at ${VERSION}, but CHANGELOG.md has no '## [${VERSION}]' section."
            echo "::error::Run scripts/prepare-release.sh ${VERSION} to roll [Unreleased] into it."
            exit 1
          fi

  package-plugin:
    name: Package Plugin (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          cache: 'pnpm'
      - run: pnpm install
      - name: Build and package (same staging as deploy/release)
        run: ./scripts/package-local.sh
      - name: Verify package contents
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          ZIP="${NAME}-v${VERSION}.zip"
          test -f "$ZIP" || (echo "$ZIP was not produced" && exit 1)
          # A root backend/ dir makes the Decky CLI assume a custom-backend
          # Docker build; py_modules/backend/ (the Python package) is fine.
          test ! -d backend || (echo "::error::repo has a root backend/ dir again" && exit 1)
          # Capture the listing once: chaining `unzip -l | grep -q` repeatedly
          # is fine under sh, but under `bash -o pipefail` grep's early exit
          # on match sends unzip a SIGPIPE (exit 141), which would flip the
          # negative guard below and could false-fail the positive checks.
          LISTING=$(unzip -l "$ZIP")
          ! echo "$LISTING" | grep -q "${NAME}/backend/" \
            || (echo "::error::${ZIP} has a top-level backend/ entry" && exit 1)
          for f in dist/index.js main.py package.json plugin.json LICENSE \
                   recover.sh py_modules/backend/__init__.py py_modules/backend/src/__init__.py \
                   py_modules/backend/src/xray_version.json static/admin.html; do
            echo "$LISTING" | grep -q "${NAME}/${f}" \
              || (echo "Missing ${f} in ${ZIP}" && exit 1)
          done
          echo "Package contains all required files"

  store-build:
    name: Store Build (Decky CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Decky CLI
        run: |
          mkdir /tmp/decky-cli
          # Pin matches the CLI version the plugin store's build workflow (decky-plugin-database) uses
          curl -f --retry 3 -L -o /tmp/decky-cli/decky \
            "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64"
          chmod +x /tmp/decky-cli/decky
      - name: Build with Decky CLI (same as the plugin store)
        run: sudo /tmp/decky-cli/decky plugin build -b -o /tmp/output -s directory .
      - name: Verify store zip contents
        run: |
          ZIP=$(ls /tmp/output/*.zip)
          echo "Built: $ZIP"
          LISTING=$(unzip -l "$ZIP")
          for f in py_modules/backend/src/importer.py static/admin.html \
                   dist/index.js main.py plugin.json LICENSE; do
            echo "$LISTING" | grep -q "$f" || (echo "::error::store zip missing $f" && exit 1)
          done
          echo "Store zip contains all required files"
