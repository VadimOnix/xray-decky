name: ShellCheck

on:
  push:
    paths:
      - "scripts/**"
      - "*.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "*.sh"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    name: Check shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          # Cover both scripts/ and the root deploy scripts.
          scandir: "."
          ignore_paths: node_modules dist
