[project]
name = "xray-decky"
version = "1.0.0"
description = "Decky Loader plugin for VLESS proxy connections with Reality protocol support"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's implicit default. Ruff
# expanded that default in 0.16.0, which turned a green `ruff check` into ~550
# findings on an unchanged tree — CI installs ruff from requirements-dev.txt
# (pinned), and this select keeps the rule set stable across upgrades too.
# Widening the set is a deliberate change: add a rule group here, fix the
# fallout in the same commit.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Imports must follow the sys.path setup (PLUGIN_DIR + py_modules) so
# backend modules resolve
"main.py" = ["E402"]
